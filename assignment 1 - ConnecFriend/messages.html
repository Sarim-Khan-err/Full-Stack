<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Messages · ConnecFriend</title><link rel="stylesheet" href="css/bootstrap.min.css"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="messages"><div class="site-wrap container"><header id="site-header"></header><main><section class="page-heading"><p class="eyebrow mb-1">A NOTE JUST FOR THEM</p><h1>A little <em>conversation.</em></h1><p class="text-secondary">Pick someone and send a note. You can come back to it anytime.</p></section><div class="row g-3"><section class="col-lg-4"><div class="content-panel contact-panel"><p class="eyebrow">YOUR PEOPLE</p><h2>Choose a person</h2><div id="contact-list" class="d-grid gap-1 mt-3"></div></div></section><section class="col-lg-8"><div class="content-panel chat-panel"><div id="chat-empty" class="chat-empty"><span>💬</span><h2>Start with a hello.</h2><p class="text-secondary">Choose a person from the list.</p></div><div id="chat-window" class="d-none h-100"><div class="chat-heading" id="chat-heading"></div><div class="chat-messages" id="chat-messages" aria-live="polite"></div><form class="message-form" id="message-form"><label class="visually-hidden" for="message-text">Write a message</label><input class="form-control" id="message-text" maxlength="300" placeholder="Write your message…" required><button class="btn btn-primary" type="submit">Send ↗</button></form><p id="message-error" class="small text-danger mt-2 mb-0 d-none" role="alert"></p></div></div></section></div></main><footer class="site-footer"><span>ConnecFriend</span><span>Small messages, good company.</span></footer></div><script src="js/data.js"></script><script src="js/app.js"></script><script src="js/messages.js"></script></body></html>
